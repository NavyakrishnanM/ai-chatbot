# ============================================================
# DevAssist Backend — Application Configuration
# ============================================================
#
# CONCEPT — application.properties:
# This file is the central configuration for Spring Boot.
# Spring reads it at startup and makes values available via @Value.
# You can also use application.yml (YAML format) — same idea.
#
# CONCEPT — Environment-specific profiles:
# Spring Boot supports profiles: application-dev.properties,
# application-prod.properties. In production you'd set:
#   SPRING_PROFILES_ACTIVE=prod
# and a separate file would override these values with production URLs.
# We'll keep it simple for now with a single file.
# ============================================================

# --- Server ---
# Spring Boot defaults to 8080. We keep it explicit for clarity.
server.port=8080

# --- Application name (used in logs and actuator) ---
spring.application.name=devassist-backend

# --- AI Service URL ---
# The Python FastAPI service URL. ChatService reads this via @Value.
# Change to the real URL in production without touching Java code.
ai.service.url=http://localhost:8000

# --- Frontend URL (for CORS) ---
# WebConfig reads this to configure which origin can call our API.
frontend.url=http://localhost:4200

# --- Logging ---
# Show INFO-level logs from our own code, WARN from Spring internals.
# This keeps the console readable during development.
logging.level.com.devassist=INFO
logging.level.org.springframework.web=WARN

# --- RestClient / HTTP Client config ---
# (Optional) Connection and read timeouts — prevents requests hanging
# forever if the Python service is slow or down.
# These require additional config bean in production; leaving as comments
# for now so the app starts without extra setup.
# spring.web.client.connect-timeout=5000
# spring.web.client.read-timeout=30000

# --- Jackson (JSON serialization) ---
# Serialize Java camelCase field names as camelCase JSON keys (default).
# e.g. modelUsed → "modelUsed" in the JSON response to Angular.
spring.jackson.property-naming-strategy=LOWER_CAMEL_CASE

